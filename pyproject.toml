[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adbeam-me-up"
version = "0.1.0"
description = "Desktop ADB presets with verified progress and resumable runs"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
adbeam-me-up = "vivo_power.gui:main"

[tool.setuptools.packages.find]
include = ["vivo_power*"]

[tool.setuptools.package-data]
vivo_power = ["resources/*.jar"]
